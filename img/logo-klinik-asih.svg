<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="greenCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a859" />
      <stop offset="100%" stop-color="#70bc36" />
    </linearGradient>
    <linearGradient id="cyanWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78cbf5" />
      <stop offset="100%" stop-color="#b6e3f9" />
    </linearGradient>
  </defs>

  <!-- Green Medical Cross Outline -->
  <path d="M 200 40 
           A 30 30 0 0 1 300 40 
           L 300 135 
           L 395 135 
           A 30 30 0 0 1 425 165 
           L 425 240 
           A 30 30 0 0 1 395 270 
           L 320 270 
           L 320 345 
           A 30 30 0 0 1 290 375 
           L 210 375 
           A 30 30 0 0 1 180 345 
           L 180 270 
           L 105 270 
           A 30 30 0 0 1 75 240 
           L 75 165 
           A 30 30 0 0 1 105 135 
           L 200 135 Z" 
        fill="none" 
        stroke="url(#greenCrossGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Heads of the figures -->
  <!-- Left Head (Orange) -->
  <circle cx="205" cy="115" r="23" fill="#f37023" />
  <!-- Center Dot (Green) -->
  <circle cx="250" cy="132" r="16" fill="#00a859" />
  <!-- Right Head (Magenta/Purple) -->
  <circle cx="295" cy="115" r="23" fill="#a02868" />

  <!-- Heart & Embracing Figures -->
  <!-- Left Green Wing / Body -->
  <path d="M 205 140 
           C 145 150 120 220 185 275 
           C 220 305 250 325 255 330 
           C 252 310 240 280 215 255 
           C 185 225 190 180 225 165 
           C 245 155 255 170 250 185 
           C 245 200 225 215 210 230 
           C 200 240 195 255 215 270 
           C 205 245 205 205 235 180 
           C 245 170 240 150 205 140 Z" 
        fill="#00a859" />

  <!-- Right Cyan Wing / Body -->
  <path d="M 295 140 
           C 355 150 375 220 315 275 
           C 285 300 260 320 255 330 
           C 260 305 275 275 295 250 
           C 320 220 315 175 275 165 
           C 260 160 250 170 255 185 
           C 265 210 295 230 290 260 
           C 305 240 310 200 280 175 
           C 270 165 275 148 295 140 Z" 
        fill="#80c8f5" />

  <!-- Inner Heart (Green) -->
  <path d="M 250 185 
           C 240 165 220 170 215 190 
           C 210 215 235 240 250 255 
           C 265 240 290 215 285 190 
           C 280 170 260 165 250 185 Z" 
        fill="#00a859" />

  <!-- Inner Heart Core (White) -->
  <path d="M 250 200 
           C 245 188 232 192 230 204 
           C 228 218 242 232 250 240 
           C 258 232 272 218 270 204 
           C 268 192 255 188 250 200 Z" 
        fill="#ffffff" />

  <!-- Typography -->
  <!-- KLINIK ASIH -->
  <text x="250" y="440" 
        font-family="'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="42" 
        font-weight="900" 
        letter-spacing="2" 
        fill="#32636d" 
        text-anchor="middle">KLINIK ASIH</text>

  <!-- Motto: Kesehatan Anda Kebahagiaan Bersama -->
  <text x="250" y="475" 
        font-family="'Georgia', 'Times New Roman', serif" 
        font-size="20" 
        font-style="italic" 
        font-weight="bold" 
        fill="#223b44" 
        text-anchor="middle">Kesehatan Anda Kebahagiaan Bersama</text>
</svg>
